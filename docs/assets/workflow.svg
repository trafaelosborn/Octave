<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-labelledby="t d">
  <title id="t">Octave research workflow schematic</title>
  <desc id="d">Four connected stages: local sources and documents; ask and explore with model providers; review edits and evidence; compile and package. This is a schematic, not a screenshot.</desc>
  <rect width="1040" height="310" rx="18" fill="#162b29"/>
  <text x="42" y="45" font-size="17" font-family="system-ui,Segoe UI,sans-serif" font-weight="700" letter-spacing="1.7" fill="#9ad9c7">OCTAVE  /  LOCAL-FIRST RESEARCH</text>
  <text x="42" y="72" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#b3cac3">A documented workflow · schematic, not an app screenshot</text>
  <g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="42" y="112" width="211" height="136" rx="11" fill="#274943" stroke="#567d72"/>
    <text x="148" y="160" font-size="16" fill="#ffffff" font-weight="700">01 / Source</text>
    <text x="148" y="186" font-size="13" fill="#dbebe5">Local research files</text>
    <text x="148" y="205" font-size="13" fill="#dbebe5">and document context</text>
    <rect x="285" y="112" width="211" height="136" rx="11" fill="#274943" stroke="#567d72"/>
    <text x="391" y="160" font-size="16" fill="#ffffff" font-weight="700">02 / Explore</text>
    <text x="391" y="186" font-size="13" fill="#dbebe5">Selected model provider</text>
    <text x="391" y="205" font-size="13" fill="#dbebe5">and persistent chat</text>
    <rect x="528" y="112" width="211" height="136" rx="11" fill="#274943" stroke="#567d72"/>
    <text x="634" y="160" font-size="16" fill="#ffffff" font-weight="700">03 / Review</text>
    <text x="634" y="186" font-size="13" fill="#dbebe5">Diffs, citations</text>
    <text x="634" y="205" font-size="13" fill="#dbebe5">and evidence checks</text>
    <rect x="771" y="112" width="227" height="136" rx="11" fill="#274943" stroke="#567d72"/>
    <text x="885" y="160" font-size="16" fill="#ffffff" font-weight="700">04 / Deliver</text>
    <text x="885" y="186" font-size="13" fill="#dbebe5">LaTeX PDF compile</text>
    <text x="885" y="205" font-size="13" fill="#dbebe5">and submission bundle</text>
  </g>
  <g fill="none" stroke="#a0ddc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M259 180 H276 M268 173 L276 180 L268 187"/>
    <path d="M502 180 H519 M511 173 L519 180 L511 187"/>
    <path d="M745 180 H762 M754 173 L762 180 L754 187"/>
  </g>
</svg>
